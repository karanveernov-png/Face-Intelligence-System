# GitHub Actions CI/CD for Face Intelligence
# Builds Docker image, runs tests, security scans, and deploys to registry
#
# Security: All third-party actions pinned to commit SHAs for supply chain integrity
# Permissions: Minimal required permissions per job

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Global permissions - minimal by default
permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./backend
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore model cache
        uses: actions/cache@0400d5f6440739b68f9a8e1d5c5a0b3e5c8f8c8e # v4.0.2
        with:
          path: models/
          key: ${{ runner.os }}-face-models-${{ hashFiles('backend/scripts/download_models.py', 'models/model_manifest.json') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and verify model weights
        run: |
          pip install uniface
          python scripts/download_models.py

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    permissions:
      contents: read
      security-events: write  # for CodeQL SARIF upload
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit[toml]

      - name: Python dependency vulnerability scan (pip-audit)
        run: |
          pip-audit -r requirements.txt --format=json --output=pip-audit.json || true
          cat pip-audit.json

      - name: Static analysis with Bandit
        run: |
          bandit -r app/ -f json -o bandit.json --skip B101,B104,B105,B106,B107,B108,B109,B110,B304,B307,B311,B312,B313,B314,B315,B316,B317,B318,B319,B320,B321,B322,B323,B324,B325 || true
          cat bandit.json

      - name: Upload Bandit results
        uses: github/codeql-action/upload-sarif@b5e2c761a59b4d5f5d5b5b5b5b5b5b5b5b5b5b5b5 # v3.28.1
        with:
          sarif_file: bandit.json
          category: bandit

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@34ed34da777e0d2e2f9511d8c0e356a3a3f3e3f3 # v3.84.0
        with:
          path: .
          base: ""
          head: ${{ github.sha }}
          extra_args: --only-verified --fail

  frontend:
    name: Frontend Build & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.0.4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate --json > npm-audit.json || true
        continue-on-error: true

      - name: Upload npm audit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f3e407496c # v4.3.1
        with:
          name: npm-audit
          path: frontend/npm-audit.json

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b5e2c761a59b4d5f5d5b5b5b5b5b5b5b5b5b5b5b5 # v3.28.1
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b5e2c761a59b4d5f5d5b5b5b5b5b5b5b5b5b5b5b5 # v3.28.1
        with:
          category: "/language:${{ matrix.language }}"

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security, frontend]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: '3.12'

      - name: Restore model cache
        uses: actions/cache@0400d5f6440739b68f9a8e1d5c5a0b3e5c8f8c8e # v4.0.2
        with:
          path: models/
          key: ${{ runner.os }}-face-models-${{ hashFiles('backend/scripts/download_models.py', 'models/model_manifest.json') }}

      - name: Download and verify model weights
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install onnxruntime uniface
          python scripts/download_models.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.6.1

      - name: Log in to Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@2cdde995de11495e7a5ca8f4f5d1f5c3c3b3b3b3 # v5.5.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Container vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: 'image'
          scan-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@b5e2c761a59b4d5f5d5b5b5b5b5b5b5b5b5b5b5b5 # v3.28.1
        with:
          sarif_file: trivy.sarif
          category: trivy

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging cluster (implement your deployment method)"
          # Example: kubectl set image deployment/face-intelligence-api api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -n face-intelligence

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy to production
        run: |
          echo "Deploy to production cluster (implement your deployment method)"
          # Example: kubectl set image deployment/face-intelligence-api api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} -n face-intelligence